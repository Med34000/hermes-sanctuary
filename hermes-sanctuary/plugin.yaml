# Hermes Sanctuary — plugin Hermes (agent + tableau de bord + Desktop)
# 2026-11-05 ≈11:20, mis à jour ≈12:35, ≈15:00, ≈16:20, ≈17:00 et ≈17:35 (nouveau nom : Hermes Sanctuary) (Europe/Zurich) — Claude (Cowork) — Anthropic, Claude Opus 5.5, pour Médéric Morin
name: hermes-sanctuary
version: 2.7.0
manifest_version: 2
api_version: 1
description: "A living view of your agent: five animated characters wake up when Hermes uses their tools, in two worlds (Olympus, the Clearing). Tool names and times only, never content."
author: "Médéric Morin"
license: Apache-2.0
homepage: https://github.com/Med34000/hermes-sanctuary
tags: [dashboard, desktop, visualization, fun]
requires_hermes: ">=0.22.5"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - post_api_request
  - api_request_error
  - pre_approval_request
  - post_approval_response
  - subagent_start
  - subagent_stop
