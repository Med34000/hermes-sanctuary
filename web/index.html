<title>Sanctuaire Solaire</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: full-bleed 3D-style scenes (Forge au Ruisseau, Cabane Canopée) on fixed-ratio stages,
   one companion sprite per scene with several poses crossfaded on top, glass panels floating over it.
   Single warm look by design: the scene is the page. */
:root {
  --cream: #FFF4DE;
  --glass: rgba(255, 247, 229, 0.88);
  --bark: #3F2A18;
  --ink: #2C1D10;
  --muted: #7A5A3C;
  --ember: #E4802F;
  --moss: #3F7A4A;
  --aqua: #2BA7A3;
  --night: #1B2A1C;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ratio: 1.7913; /* background image width / height */
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
}
.scene { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
.scene[data-view="grid"] { background: radial-gradient(120% 90% at 50% 0%, #2d3f2b 0%, #1b261c 55%, #121a13 100%); }
.scene[data-view="grid"][data-layout="stack"] { overflow-y: auto; overflow-x: hidden; }
.scene[data-view="grid"] .backdrop, .scene[data-view="grid"] .backdrop.off { opacity: 0; }
#spacer { position: absolute; left: 0; top: 0; width: 1px; pointer-events: none; }

/* blurred copy fills any area the stage does not cover (portrait screens) */
.backdrop {
  position: absolute; inset: -4%;
  background: center / cover no-repeat;
  filter: blur(18px) saturate(1.1);
  transition: opacity .7s ease, visibility 0s;
}
.backdrop[data-for="forge"] { background-image: url("atelier-bg.webp"); }
.backdrop[data-for="cabin"] { background-image: url("canopee-bg.webp"); }
.backdrop[data-for="cave"] { background-image: url("geodes-bg.webp"); }
.backdrop[data-for="oak"] { background-image: url("chene-bg.webp"); }
.backdrop[data-for="lookout"] { background-image: url("belvedere-bg.webp"); }
.backdrop.off, .stage.off { opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s .7s; }

/* the stage keeps image and sprite in the same coordinates at every size.
   Its position and size are set from JS: full scene, or one tile of the overview grid. */
.stage {
  position: absolute; left: 0; top: 0; width: 100vw; height: calc(100vw / var(--ratio));
  transition: opacity .7s ease, visibility 0s, transform .25s ease, box-shadow .25s ease;
}
.scene[data-view="grid"] .stage {
  border-radius: 20px; overflow: hidden; cursor: pointer;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .4); outline: 2px solid rgba(255, 244, 222, .14);
}
.scene[data-view="grid"] .stage:hover { transform: translateY(-3px); box-shadow: 0 18px 38px rgba(0, 0, 0, .5); outline-color: rgba(255, 200, 120, .75); }
.scene[data-view="grid"] .stage:focus-visible { outline: 3px solid var(--aqua); }
.tile-ui {
  display: none; left: 0; right: 0; bottom: 0; padding: 30px 12px 10px;
  background: linear-gradient(to top, rgba(26, 16, 6, .85), rgba(26, 16, 6, 0));
  color: var(--cream); align-items: flex-end; justify-content: space-between; gap: 8px; pointer-events: none;
}
.scene[data-view="grid"] .tile-ui { display: flex; }
.tu-name { font: 600 clamp(14px, 1.5vw, 19px)/1.1 var(--font-display); }
.tu-role { font: 700 10px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; opacity: .85; margin-top: 3px; }
.tu-badge { display: inline-flex; align-items: center; gap: 6px; font: 700 11px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: rgba(255, 247, 229, .92); color: var(--bark); white-space: nowrap; }
.tu-badge i { width: 8px; height: 8px; border-radius: 50%; background: #8aa0a6; flex: none; }
.tu-badge[data-st="work"] i { background: var(--ember); animation: pulse 1s ease-in-out infinite; }
.tu-badge[data-st="done"] i { background: var(--moss); }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .5; } }
.hint {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin: 0; text-align: center;
  font: 700 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 244, 222, .65);
  display: none; pointer-events: none;
}
.scene[data-view="grid"][data-layout="wide"] .hint { display: block; }
.scene[data-view="grid"] .card.caption { display: none; }
.scene[data-view="grid"][data-layout="stack"] .card.log { display: none; }
.scene[data-view="grid"] .card.log { overflow: hidden; box-sizing: border-box; max-width: none; margin: 0; bottom: auto; }
.stage > * { position: absolute; }
.bg { inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }

.rays {
  inset: 0;
  mix-blend-mode: screen;
  background:
    linear-gradient(112deg, transparent 52%, rgba(255, 226, 150, .20) 58%, transparent 64%),
    linear-gradient(112deg, transparent 68%, rgba(255, 226, 150, .14) 73%, transparent 79%),
    linear-gradient(112deg, transparent 80%, rgba(255, 226, 150, .12) 85%, transparent 90%);
  animation: rays 7s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes rays { from { opacity: .45; transform: translateX(-1%); } to { opacity: 1; transform: translateX(1%); } }

.twinkle {
  width: .3%; aspect-ratio: 1; border-radius: 50%;
  background: #fff; box-shadow: 0 0 .5vw .15vw rgba(255, 255, 255, .85);
  opacity: 0; animation: twinkle 3.2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: .95; transform: scale(1); } }

/* companions: sprite + shadow + glow, geometry per scene (stage coordinates) */
.actor { transform-origin: 50% 100%; will-change: transform; }
#castor { left: 56%; top: 30.6%; width: 29.9%; aspect-ratio: 840 / 900; }
#chouette { left: 57%; top: 39.5%; width: 21.6%; aspect-ratio: 760 / 864; }
#shiba { left: 61.55%; top: 33%; width: 22.45%; aspect-ratio: 760 / 945; }
#renard { left: 56.6%; top: 38%; width: 29.8%; aspect-ratio: 760 / 826; }
#taupe { left: 57.7%; top: 43.2%; width: 22.9%; aspect-ratio: 760 / 854; }
.shadow { background: radial-gradient(ellipse at center, rgba(35, 22, 8, .55), rgba(35, 22, 8, 0) 70%); filter: blur(2px); }
#sh-castor { left: 56%; top: 85.5%; width: 30%; height: 4.5%; }
#sh-chouette { left: 61.5%; top: 78.2%; width: 17%; height: 3.6%; background: radial-gradient(ellipse at center, rgba(30, 18, 6, .5), rgba(30, 18, 6, 0) 70%); }
.actor img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; user-select: none; -webkit-user-drag: none;
  transition: opacity .28s ease;
}
.actor .p-work, .actor .p-hit, .actor .p-done { opacity: 0; }
/* Brico-Castor at work: real hammering loop (24 frames from a generated video, green screen removed) */
#castor .vsheet { position: absolute; left: 1.8%; top: 1.15%; width: 94.51%; height: 97.32%; background: url("castor-forge-video.webp") 0 0 / 1200% 200% no-repeat; opacity: 0; pointer-events: none; }
#stage-forge.has-video[data-state="work"] .vsheet { opacity: 1; }
#stage-forge.has-video[data-state="work"] .p-work, #stage-forge.has-video[data-state="work"] .p-hit { opacity: 0 !important; }
/* Data-Taupe at work: real pickaxe loop (53 frames from a generated video, green screen removed) */
#taupe .vsheet { position: absolute; left: 16.16%; top: -13.27%; width: 97.95%; height: 112.52%; background: url("taupe-pioche-video.webp") 0 0 / 1400% 400% no-repeat; opacity: 0; pointer-events: none; }
#stage-cave.has-video[data-state="work"] .vsheet { opacity: 1; }
#stage-cave.has-video[data-state="work"] .p-work, #stage-cave.has-video[data-state="work"] .p-rest { opacity: 0 !important; }
#stage-cave.has-video[data-state="work"] #glow-cave-head { opacity: 0 !important; }
.stage[data-state="work"] .p-work { opacity: 1; }
.stage[data-state="work"] .p-rest { opacity: 0; }
#stage-forge[data-state="work"][data-hit="1"] .p-hit { opacity: 1; }
#stage-forge[data-state="work"][data-hit="1"] .p-work { opacity: 0; }
#stage-forge[data-state="work"] .actor img { transition-duration: .07s; }
#stage-forge[data-state="done"] .p-done { opacity: 1; }
#stage-forge[data-state="done"] .p-rest { opacity: 0; }
#stage-cabin[data-state="done"] .p-work { opacity: 1; }
#stage-cabin[data-state="done"] .p-rest { opacity: 0; }
#stage-cabin[data-owl="away"] .glow { opacity: 0 !important; }
#stage-cabin .actor img, #stage-cave .actor img, #stage-oak .actor img, #stage-lookout .actor img { transition-duration: .6s; }
#sh-shiba { left: 60%; top: 79%; width: 26%; height: 5%; background: radial-gradient(ellipse at center, rgba(40, 24, 8, .5), rgba(40, 24, 8, 0) 70%); }
#sh-renard { left: 59%; top: 91.5%; width: 25%; height: 4.5%; background: radial-gradient(ellipse at center, rgba(12, 24, 6, .55), rgba(12, 24, 6, 0) 70%); }
#sh-taupe { left: 59%; top: 85.5%; width: 22%; height: 5%; background: radial-gradient(ellipse at center, rgba(20, 10, 4, .6), rgba(20, 10, 4, 0) 70%); }

.actor-inner { position: absolute; inset: 0; } /* sprite and its base stay perfectly still: motion comes from pose frames, particles and glow */
.glow { transform: translate(-50%, -50%); mix-blend-mode: screen; opacity: 0; pointer-events: none; }
#glow-forge {
  left: 77.7%; top: 66.2%; width: 9%; aspect-ratio: 1.6;
  background: radial-gradient(ellipse at center, rgba(255, 190, 70, .85), rgba(255, 140, 30, 0) 68%);
}
#stage-forge[data-state="work"] .glow { opacity: .12; transition: opacity .3s ease-out; }
#stage-forge[data-state="work"][data-hit="1"] .glow { opacity: 1; transition-duration: .05s; }
#stage-forge[data-state="done"] .glow { opacity: .35; transition: opacity .6s ease-out; }
#glow-cabin {
  left: 61.2%; top: 56.2%; width: 11%; aspect-ratio: 1.2;
  background: radial-gradient(ellipse at center, rgba(255, 236, 150, .8), rgba(255, 220, 110, 0) 68%);
}
#stage-cabin[data-state="work"] .glow { opacity: .5; transition: opacity .5s ease; }
#stage-cabin[data-state="work"][data-hit="1"] .glow { opacity: 1; transition: opacity .25s ease; }

#glow-cave-head {
  left: 68.1%; top: 45.7%; width: 8%; aspect-ratio: 1;
  background: radial-gradient(circle, rgba(190, 235, 255, .9), rgba(120, 190, 255, 0) 66%);
}
#glow-cave-cart {
  left: 28.5%; top: 66.8%; width: 10%; aspect-ratio: 1.3;
  background: radial-gradient(ellipse at center, rgba(170, 160, 255, .85), rgba(120, 140, 255, 0) 68%);
}
#stage-cave[data-state="work"] .glow { opacity: .5; transition: opacity .5s ease; }
#stage-cave[data-state="work"][data-hit="1"] .glow { opacity: 1; transition: opacity .25s ease; }
#stage-cave[data-state="done"] .glow { opacity: .3; transition: opacity .6s ease-out; }
.gem {
  transform: translate(-50%, -50%); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgba(150, 170, 255, .6), rgba(150, 120, 255, 0) 66%);
  mix-blend-mode: screen; pointer-events: none; opacity: .4;
  animation: flicker 4.2s ease-in-out infinite;
}

#glow-oak {
  left: 68.8%; top: 61.6%; width: 9%; aspect-ratio: 1.2;
  background: radial-gradient(ellipse at center, rgba(255, 232, 160, .85), rgba(255, 210, 110, 0) 68%);
}
#stage-oak[data-state="work"] .glow { opacity: .55; transition: opacity .5s ease; }
#stage-oak[data-state="work"][data-hit="1"] .glow { opacity: 1; transition: opacity .25s ease; }

#glow-look-lantern {
  left: 69.6%; top: 54.2%; width: 6%; aspect-ratio: 1;
  background: radial-gradient(circle, rgba(255, 220, 120, .9), rgba(255, 190, 80, 0) 66%);
}
#glow-look-lens {
  left: 62.9%; top: 41.7%; width: 4%; aspect-ratio: 1;
  background: radial-gradient(circle, rgba(255, 255, 235, .95), rgba(255, 240, 190, 0) 62%);
}
#stage-lookout[data-state="work"] .glow { opacity: .55; transition: opacity .5s ease; }
#stage-lookout[data-state="work"][data-hit="1"] .glow { opacity: 1; transition: opacity .2s ease; }
#stage-lookout[data-state="rest"] #glow-look-lantern { opacity: .22; }
#stage-lookout[data-state="done"] #glow-look-lantern { opacity: .4; transition: opacity .6s ease-out; }

/* cabin lamps and windows: slow warm flicker */
.lamp {
  transform: translate(-50%, -50%); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 214, 130, .75), rgba(255, 190, 90, 0) 66%);
  mix-blend-mode: screen; pointer-events: none; opacity: .5;
  animation: flicker 3.4s ease-in-out infinite;
}
@keyframes flicker { 0%, 100% { opacity: .35; } 35% { opacity: .75; } 60% { opacity: .5; } 80% { opacity: .85; } }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* UI */
.bar, .card {
  position: fixed;
  background: var(--glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, .7);
  box-shadow: 0 10px 30px rgba(30, 18, 5, .22);
}
.bar {
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  border-radius: 22px;
  padding: 10px 14px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(145deg, #F7B24A, var(--ember)); display: grid; place-items: center; flex: none; }
.logo svg { width: 24px; height: 24px; }
.titles { min-width: 0; flex: 1 1 220px; }
h1 { margin: 0; font: 600 clamp(17px, 2.2vw, 24px)/1.1 var(--font-display); letter-spacing: .01em; color: var(--bark); text-wrap: balance; }
.sub { margin: 3px 0 0; font: 700 11px/1.2 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--aqua); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  font: 700 12px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  padding: 10px 14px; border-radius: 999px;
  border: 1px solid rgba(63, 42, 24, .14); background: #fff; color: var(--bark);
  cursor: default; display: inline-flex; align-items: center; gap: 8px;
}
button.pill { cursor: pointer; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ember); }
#src-pill[data-src="live"] .dot { background: #3FB45A; animation: pulse 1.6s ease-in-out infinite; }
#src-pill[data-src="lost"] .dot { background: #C0473A; }
.pill[aria-pressed="true"] { background: var(--bark); color: var(--cream); border-color: var(--bark); }
button:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
button.pill:hover { filter: brightness(.97); }

.card.caption {
  left: max(16px, env(safe-area-inset-left, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(560px, calc(100vw - 32px));
  border-radius: 24px; padding: 14px 16px 16px;
  display: grid; grid-template-columns: 64px 1fr; gap: 6px 14px; align-items: start;
}
.avatar { width: 64px; height: 64px; border-radius: 18px; overflow: hidden; background: #F8D9A8; grid-row: span 2; border: 2px solid #fff; box-shadow: 0 3px 10px rgba(60, 35, 10, .25); }
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; transform: scale(1.8); transform-origin: 56% 22%; display: block; }
.avatar.shiba img { object-position: 50% 0%; transform: scale(1.9); transform-origin: 38% 16%; }
.avatar.fox img { object-position: 50% 0%; transform: scale(3); transform-origin: 44% 17%; }
.avatar.mole img { object-position: 50% 0%; transform: scale(1.5); transform-origin: 38% 14%; }
.avatar.owl img { object-position: 50% 0%; transform: scale(1.55); transform-origin: 52% 20%; }
.who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.name { font: 600 20px/1 var(--font-display); color: #9A4B14; }
.role { font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--aqua); padding: 5px 9px; border-radius: 999px; }
.msg { margin: 0; font: 700 15px/1.4 var(--font-body); color: var(--ink); min-height: 2.8em; }
.ctrl { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.ctrl.team { margin-top: 8px; gap: 6px; }
.ctrl.team .pill { padding: 10px 11px; }
.ctrl .lbl { font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }

.card.log {
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 96px);
  width: min(340px, 26vw);
  border-radius: 20px; padding: 12px 14px;
}
.log h2 { margin: 0 0 8px; font: 700 11px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.log h2 span { color: var(--moss); }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font: 400 12px/1.4 var(--font-mono); color: var(--ink); }
.log li { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.log time { color: var(--muted); }
.log .tag { color: #B2561A; font-weight: 500; }
@media (max-width: 900px), (max-aspect-ratio: 1/1) { .card.log { display: none; } }
@media (max-width: 520px) { .sub { display: none; } .pill { padding: 9px 11px; font-size: 11px; } }
@media (max-width: 520px) { .card.caption { padding: 10px 12px 12px; gap: 4px 12px; } .msg { font-size: 14px; min-height: 0; } .ctrl .lbl { display: none; } .ctrl { gap: 6px; margin-top: 4px; } .ctrl.team .pill { padding: 9px 11px; } }
@media (prefers-reduced-motion: reduce) {
  .rays, .twinkle, .lamp, .gem, .actor-inner, .glow { animation: none !important; }
  .actor img { transition: none; }
}
</style>

<main class="scene" id="scene" data-scene="forge" data-view="grid" data-layout="wide">
  <div class="backdrop off" data-for="forge" aria-hidden="true"></div>
  <div class="backdrop off" data-for="cabin" aria-hidden="true"></div>
  <div class="backdrop off" data-for="cave" aria-hidden="true"></div>
  <div class="backdrop off" data-for="oak" aria-hidden="true"></div>
  <div class="backdrop off" data-for="lookout" aria-hidden="true"></div>

  <div class="stage" id="stage-forge" data-state="rest" data-hit="0">
    <img class="bg" src="atelier-bg.webp" alt="Une clairière ensoleillée avec une forge en pierre, un moulin à eau et un ruisseau turquoise">
    <div class="rays" aria-hidden="true"></div>
    <div class="shadow" id="sh-castor" aria-hidden="true"></div>
    <div class="actor" id="castor">
      <div class="actor-inner">
        <img class="p-rest" src="castor-rest.webp" alt="Brico-Castor, un castor en tablier bleu, appuyé sur son enclume">
        <img class="p-work" src="castor-work.webp" alt="" aria-hidden="true">
        <img class="p-hit" src="castor-hit.webp" alt="" aria-hidden="true">
        <img class="p-done" src="castor-victory.webp" alt="" aria-hidden="true">
        <div class="vsheet" aria-hidden="true"></div>
      </div>
    </div>
    <div class="glow" id="glow-forge" aria-hidden="true"></div>
  </div>

  <div class="stage off" id="stage-cabin" data-state="rest" data-hit="0">
    <img class="bg" src="canopee-bg.webp" alt="Une cabane-bibliothèque dans la canopée, au coucher du soleil, avec une terrasse en bois">
    <div class="shadow" id="sh-chouette" aria-hidden="true"></div>
    <div class="actor" id="chouette">
      <div class="actor-inner">
        <img class="p-rest" src="chouette-rest.webp" alt="La Chouette Céleste, une chouette à lunettes et écharpe étoilée, perchée sur une souche">
        <img class="p-work" src="chouette-read.webp" alt="" aria-hidden="true">
      </div>
    </div>
    <div class="glow" id="glow-cabin" aria-hidden="true"></div>
  </div>

  <div class="stage off" id="stage-cave" data-state="rest" data-hit="0">
    <img class="bg" src="geodes-bg.webp" alt="Une alcôve souterraine aux géodes de cristal bleu et violet, avec un chariot de mine et des lanternes">
    <div class="shadow" id="sh-taupe" aria-hidden="true"></div>
    <div class="actor" id="taupe">
      <div class="actor-inner">
        <img class="p-rest" src="taupe-rest.webp" alt="La Data-Taupe, une taupe mineuse avec casque à lampe de cristal, au repos sur son monticule">
        <img class="p-work" src="taupe-work.webp" alt="" aria-hidden="true">
        <div class="vsheet" aria-hidden="true"></div>

  function applySen(sen) {
    if (!sen || !sen.approbation) return;
    approval = !!sen.approbation.en_attente && (sen.maj - (sen.approbation.debut || 0) < RENARD_STALE);
    if (!prevSen) { prevSen = sen; return; }
    if (sen.dernier !== prevSen.dernier) {
      lastWork.shiba = Date.now();
      if (sen.erreurs_api > prevSen.erreurs_api) S.log("ALERTE", "Shiba Sentinel aboie : le modèle ou le fournisseur ne répond pas.");
      if (sen.erreurs_outils > prevSen.erreurs_outils) {
        var o = sen.outils_en_erreur || {}, po = prevSen.outils_en_erreur || {}, nom = "";
        Object.keys(o).forEach(function (k) { if (o[k] > (po[k] || 0)) nom = k; });
        S.log("ALERTE", "Shiba Sentinel a repéré une erreur" + (nom ? " sur l'outil « " + nom + " »." : "."));
      }
      if (sen.approbation.n > prevSen.approbation.n) S.log("GARDE", "Hermes attend ton approbation : Shiba Sentinel monte la garde.");
      if (prevSen.approbation.en_attente && !sen.approbation.en_attente) S.log("GARDE", "Approbation reçue : Shiba Sentinel relâche la garde.");
    }
    prevSen = sen;
  }
  function apply(e) {
    var now = Date.now(), a = e.animaux || {}, r = e.renard || {};
    if (!prev) { prev = e; IDS.forEach(function (id) { phase[id] = "rest"; }); return; }
    var pa = prev.animaux || {}, pr = prev.renard || {};
    var renardBusy = !!r.en_cours && (e.maj - (r.debut || 0) < RENARD_STALE);
    if (r.debut !== pr.debut && r.en_cours) S.log("HERMES", "Nouvelle demande reçue : Kitsune Hermes ouvre sa sacoche.");
    IDS.forEach(function (id) {
      if (id === "renard") return;
      var cur = a[id] || {}, old = pa[id] || {};
      if (cur.dernier && cur.dernier !== old.dernier) {
        var wasIdle = phase[id] !== "work";
        lastWork[id] = now;
        if (wasIdle && renardBusy && !S.isAuto()) {
          phase[id] = "work"; inFlight[id] = true;
          S.mail("renard", id, function () { inFlight[id] = false; set(id, phase[id]); });
          setTimeout(function () { if (inFlight[id]) { inFlight[id] = false; set(id, phase[id]); } }, 4000);
        }
        else set(id, "work");
      }
    });
    prev = e;
    tick(renardBusy, r.fin !== pr.fin && !r.en_cours);
  }
  var renardState = { busy: false, doneAt: 0 };
  function tick(renardBusy, justEnded) {
    var now = Date.now();
    if (renardBusy !== undefined) {
      renardState.busy = renardBusy;
      if (justEnded) renardState.doneAt = now;
    }
    if (approval) { lastWork.shiba = now; }
    if (renardState.busy) set("renard", "work");
    else if (now - renardState.doneAt < DONE_HOLD) set("renard", "done");
    else set("renard", "rest");
    IDS.forEach(function (id) {
      if (id === "renard" || !lastWork[id]) return;
      var age = now - lastWork[id];
      if (age < WORK_HOLD) set(id, "work");
      else if (age < WORK_HOLD + DONE_HOLD) set(id, "done");
      else set(id, "rest");
    });
  }

  function poll() {
    fetch(SRC + (SRC.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" })
      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (e) {
        if (!e || !e.animaux) throw new Error("format");
        fails = 0;
        if (!isLive) {
          isLive = true; window.__sanctuaireLive = true; S.stopAuto(); IDS.forEach(function (id) { S.setState(id, "rest", true); });
          S.log("EN DIRECT", "Connecté à Hermes : les compagnons suivent sa vraie activité.");
        }
        badge("live"); apply(e);
        return fetch(SRC_SENT + "?t=" + Date.now(), { cache: "no-store" })
          .then(function (r2) { return r2.ok ? r2.json() : null; })
          .then(applySen, function () {});
      })
      .catch(function () {
        fails++;
        if (isLive && fails === 3) { badge("lost"); S.log("RESEAU", "Hermes injoignable : nouvelle tentative en cours."); }
      })
      .then(function () { setTimeout(poll, isLive || fails < 2 ? POLL : 30000); });
  }
  setInterval(function () { if (isLive) tick(); }, 1000);
  poll();
})();
</script>
