<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sanctuaire Panorama</title>

<!-- 2026-11-03 ≈07:40 (Europe/Zurich) — Claude (Cowork) — Anthropic, Claude Opus 5.5 : avion en papier, images dans le chat -->
<!-- Panorama — page commune à tous les environnements. Le moteur (moteur.js) lit l'habillage dans themes/<id>/theme.json
     (choix possible par l'adresse : panorama.html?theme=<id>). La colonne de droite est réservée au futur chat.
     2026-11-02 ≈19:00 (Europe/Zurich) — Claude (Cowork) — Anthropic, Claude Opus 5.5 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  --cream: #FFF4DE; --glass: rgba(255, 247, 229, .9); --bark: #3F2A18; --ink: #2C1D10; --muted: #7A5A3C;
  --accent: #E4802F; --accent2: #2BA7A3; --moss: #3F7A4A; --night: #142016;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ratio: 2.3568;
  --chat-w: 0px; /* largeur de la future colonne de chat (0 tant qu'elle n'existe pas) */
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }

.backdrop { position: fixed; inset: -5%; background: center / cover no-repeat; filter: blur(22px) brightness(.55) saturate(1.1); }
.viewport { position: fixed; top: 0; bottom: 0; left: 0; right: var(--chat-w); overflow-x: auto; overflow-y: hidden; display: flex; align-items: center; }
.pano {
  position: relative; flex: none; margin: 0 auto; overflow: hidden;
  width: max(min(calc(100vw - var(--chat-w)), calc((100vh - 140px) * var(--ratio))), 900px);
  aspect-ratio: 2576 / 1093;
  background: center / 100% 100% no-repeat;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
}
.rays { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
  background: linear-gradient(118deg, transparent 58%, rgba(255, 226, 150, .16) 63%, transparent 69%),
              linear-gradient(118deg, transparent 72%, rgba(255, 226, 150, .12) 76%, transparent 81%);
  animation: rays 8s ease-in-out infinite alternate; }
@keyframes rays { from { opacity: .4; } to { opacity: 1; } }

/* personnages : ancrés aux pieds (left = x, top = sol), hauteur en % du panorama */
.actor { position: absolute; transform: translate(-50%, -100%); transform-origin: 50% 100%; cursor: pointer; }
.actor .sprite { position: relative; height: 100%; transition: opacity .25s ease; }
.actor img { position: absolute; left: 50%; bottom: 0; height: 100%; width: auto; transform: translateX(-50%); transition: opacity .35s ease; user-select: none; -webkit-user-drag: none; }
.actor .p-work, .actor .p-hit { opacity: 0; }
.actor[data-state="work"] .p-work { opacity: 1; }
.actor[data-state="work"] .p-rest { opacity: 0; }
.actor[data-state="work"][data-hit="1"] .p-hit { opacity: 1; }
.actor[data-state="work"][data-hit="1"] .p-work { opacity: 0; }
.actor[data-done-sprite="work"][data-state="done"] .p-work { opacity: 1; }
.actor[data-done-sprite="work"][data-state="done"] .p-rest { opacity: 0; }
.actor .breath { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breath 4.5s ease-in-out infinite; }
@keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.006, 1.012); } }
.actor[data-state="work"] .breath { animation: busy .9s ease-in-out infinite; }
@keyframes busy { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-1.2%) rotate(-.6deg); } 60% { transform: translateY(0) rotate(.5deg); } }
.actor[data-state="done"] .breath { animation: hop .7s ease-out 2; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6%); } }
.actor::before {
  content: ""; position: absolute; left: 50%; bottom: -3%; width: 90%; height: 16%; transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(255, 200, 90, .65), rgba(255, 160, 40, 0) 70%);
  opacity: 0; transition: opacity .5s ease; mix-blend-mode: screen; pointer-events: none;
}
.actor[data-state="work"]::before { opacity: 1; animation: glow 1.4s ease-in-out infinite; }
.actor[data-state="done"]::before { opacity: .8; background: radial-gradient(ellipse at center, rgba(140, 230, 120, .6), rgba(80, 200, 90, 0) 70%); }
@keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

/* boucles animées tirées de vidéos (planches d'images) */
.vsheet { position: absolute; background-repeat: no-repeat; background-position: 0 0; opacity: 0; pointer-events: none; }
.actor.has-video[data-state="work"] .breath { opacity: 0; animation: none; }
.actor.has-video[data-state="work"] .vsheet.main { opacity: 1; }
.actor.has-video[data-state="work"][data-alert="1"] .vsheet.main { opacity: 0; }
.actor.has-video[data-state="work"][data-alert="1"] .vsheet.alert { opacity: 1; }
.actor.has-video[data-state="work"][data-vphase="intro"] .vsheet.main { opacity: 0; }
.actor.has-video[data-state="work"][data-vphase="intro"] .vsheet.intro { opacity: 1; }
.actor.has-video[data-state="listen"] .breath { opacity: 0; animation: none; }
.actor.has-video[data-state="listen"] .vsheet.listen { opacity: 1; }

.tag {
  position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -6px);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font: 700 clamp(9px, .75vw, 12px)/1 var(--body); letter-spacing: .05em; text-transform: uppercase;
  padding: 5px 9px; border-radius: 999px; background: rgba(255, 247, 229, .92); color: var(--bark);
  box-shadow: 0 4px 12px rgba(30, 18, 5, .3); pointer-events: none;
}
.tag i { width: 7px; height: 7px; border-radius: 50%; background: #8aa0a6; flex: none; }
.actor[data-state="work"] .tag i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.actor[data-state="done"] .tag i { background: var(--moss); }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); opacity: .5; } }

/* coordinateur qui marche, compagnon qui s'envole */
.walker { position: absolute; transform: translate(-50%, -100%); pointer-events: none; display: none; z-index: 5; }
.walker .flip, .walker .sheet, .flyer .sheet { position: absolute; inset: 0; background-repeat: no-repeat; }
.walker::after { content: ""; position: absolute; left: 50%; bottom: -2%; width: 60%; height: 7%; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(30, 18, 6, .45), rgba(30, 18, 6, 0) 70%); }
.pano[data-walking="1"] .actor[data-role="coordination"] .sprite { opacity: 0; }
.flyer { position: absolute; transform: translate(-50%, -50%); pointer-events: none; display: none; }

/* le coordinateur crie et lance un avion en papier (2026-11-03) */
.shout {
  position: absolute; z-index: 7; pointer-events: none; white-space: nowrap; opacity: 0;
  transform: translate(-50%, -100%) scale(.8); transform-origin: 50% 100%;
  padding: .45em .8em; border-radius: 14px; background: #fff; color: var(--bark);
  font: 600 clamp(11px, 1.05vw, 16px)/1.2 var(--display); box-shadow: 0 6px 18px rgba(30, 18, 5, .3);
  transition: opacity .16s ease, transform .16s ease;
}
.shout::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.shout.show { opacity: 1; transform: translate(-50%, -100%) scale(1); animation: cri .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes cri { 0% { transform: translate(-50%, -100%) scale(.6); } 60% { transform: translate(-50%, -100%) scale(1.12); } 100% { transform: translate(-50%, -100%) scale(1); } }
.plane { position: absolute; z-index: 6; width: 2.9%; aspect-ratio: 1; pointer-events: none; transform: translate(-50%, -50%); filter: drop-shadow(0 3px 3px rgba(30, 18, 5, .35)); }
.plane svg { display: block; width: 100%; height: 100%; }
.poof { position: absolute; z-index: 6; width: 3.2%; aspect-ratio: 1; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255, 238, 175, .95), rgba(255, 200, 90, 0) 70%); animation: poof .45s ease-out forwards; }
@keyframes poof { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }

/* barre du haut */
.bar {
  position: fixed; z-index: 10; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left)); right: calc(max(16px, env(safe-area-inset-right)) + var(--chat-w));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 9px 14px; border-radius: 20px;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(30, 18, 5, .25);
}
.logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(145deg, #F7B24A, var(--accent)); display: grid; place-items: center; flex: none; }
.logo svg { width: 22px; height: 22px; }
.titles { flex: 1 1 200px; min-width: 0; }
h1 { margin: 0; font: 600 clamp(16px, 2vw, 22px)/1.1 var(--display); color: var(--bark); }
.sub { margin: 2px 0 0; font: 700 10px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--accent2); }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: 700 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 9px 13px; border-radius: 999px; border: 1px solid rgba(63, 42, 24, .14); background: #fff; color: var(--bark); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
button.pill, a.pill { cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--bark); color: var(--cream); }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
#src-pill[data-src="live"] .dot { background: #3FB45A; animation: pulse 1.6s ease-in-out infinite; }
#src-pill[data-src="lost"] .dot { background: #C0473A; }
button:focus-visible, a:focus-visible, .actor:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }

/* journal et titre d'activité */
.log {
  position: fixed; z-index: 10; right: calc(max(16px, env(safe-area-inset-right)) + var(--chat-w)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: min(380px, calc(100vw - 32px)); padding: 10px 13px; border-radius: 16px;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(30, 18, 5, .25);
}
.log h2 { margin: 0 0 6px; font: 700 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.log h2 span { color: var(--moss); }
.log ol { list-style: none; margin: 0; padding: 0; font: 400 11.5px/1.45 var(--mono); color: var(--ink); }
.log li { display: grid; grid-template-columns: 56px 1fr; gap: 6px; }
.log time { color: var(--muted); }
.log .k { color: #B4571C; }
@media (max-width: 700px) { .log { display: none; } }
body.bands .log { left: calc((100vw - var(--chat-w)) / 2); right: auto; transform: translateX(-50%); width: min(820px, calc(100vw - var(--chat-w) - 32px)); display: block; }
body.bands .log ol { font-size: 12.5px; }
body.bands .log li { grid-template-columns: 70px 1fr; }
#headline {
  position: fixed; z-index: 9; left: calc((100vw - var(--chat-w)) / 2); transform: translate(-50%, -50%); width: min(900px, calc(100vw - var(--chat-w) - 32px));
  text-align: center; margin: 0; display: none; pointer-events: none;
  font: 600 clamp(18px, 2.2vw, 28px)/1.25 var(--display); color: var(--cream); text-shadow: 0 2px 14px rgba(0, 0, 0, .55);
}
#headline small { display: block; margin-top: 6px; font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 244, 222, .7); }
#headline span { transition: opacity .4s ease; }
body.bands #headline { display: block; }
@media (prefers-reduced-motion: reduce) { .actor .breath, .rays, .actor::before { animation: none !important; } }

/* ---- chat : colonne à droite (grand écran), feuille qui monte du bas (petit écran) ---- */
@media (min-width: 1100px) { :root { --chat-w: 400px; --folders-w: 0px; } }
@media (min-width: 1300px) { :root { --chat-w: 580px; --folders-w: 172px; } }
#chat {
  position: fixed; z-index: 20; display: flex; flex-direction: column; gap: 10px;
  background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: -10px 0 40px rgba(20, 12, 4, .35); color: var(--ink);
}
@media (min-width: 1100px) {
  #chat { top: 0; right: 0; bottom: 0; width: var(--chat-w); padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px); border-left: 1px solid rgba(255, 255, 255, .6); }
  #chat-toggle { display: none; }
}
/* dossiers (2026-11-03) : colonne à gauche du chat sur grand écran, bande à faire défiler ailleurs */
#chat-folders { flex: none; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#chat-folders::-webkit-scrollbar { display: none; }
.f-title { display: none; }
#folder-list { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
.folder { display: flex; align-items: center; gap: 6px; width: 100%; white-space: nowrap; text-align: left; font: 700 12.5px/1.2 var(--body); padding: 8px 11px; border-radius: 12px; border: 1px solid rgba(63, 42, 24, .14); background: rgba(255, 255, 255, .7); color: var(--bark); cursor: pointer; }
.folder:hover { background: #fff; }
.folder[aria-current="true"] { background: var(--bark); color: var(--cream); border-color: var(--bark); }
.folder .ico { flex: none; }
.folder .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.folder .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: auto; }
.folder.divers { color: var(--muted); }
.folder.divers[aria-current="true"] { color: var(--cream); }
#folder-add { flex: none; white-space: nowrap; font: 700 12px/1 var(--body); padding: 8px 11px; border-radius: 12px; border: 1px dashed rgba(63, 42, 24, .35); background: transparent; color: var(--muted); cursor: pointer; }
#folder-add:hover { color: var(--bark); border-color: var(--bark); }
#chat-folder-menu[hidden] { display: none; }
.fmenu { position: fixed; z-index: 40; display: flex; flex-direction: column; min-width: 150px; padding: 6px; border-radius: 14px; background: #fff; box-shadow: 0 10px 30px rgba(30, 18, 5, .3); }
.fmenu button { text-align: left; font: 700 13px/1.2 var(--body); padding: 9px 11px; border: 0; border-radius: 9px; background: transparent; color: var(--bark); cursor: pointer; }
.fmenu button:hover { background: var(--cream); }
#chat-new[hidden] { display: none; }
@media (min-width: 1300px) {
  #chat { padding-left: calc(var(--folders-w) + 14px); }
  #chat-folders { position: absolute; left: 0; top: 0; bottom: 0; width: var(--folders-w); flex-direction: column; overflow-y: auto; overflow-x: hidden;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 10px 14px; border-right: 1px solid rgba(63, 42, 24, .1); background: rgba(63, 42, 24, .05); }
  .f-title { display: block; margin: 4px 4px 6px; font: 700 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #folder-list { flex-direction: column; }
  .folder { white-space: normal; align-items: flex-start; }
  .folder .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .folder .dot { margin-top: 4px; }
  #folder-add { margin-top: 4px; width: 100%; text-align: left; }
}
@media (max-width: 1099px) {
  #chat { left: 0; right: 0; bottom: 0; height: 68px; padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 10px); border-radius: 22px 22px 0 0; transition: height .35s ease; overflow: hidden; }
  #chat.open { height: min(64vh, 620px); }
  .log { display: none !important; }
}
.chat-head { display: flex; align-items: center; gap: 12px; flex: none; }
.chat-avatar { width: 48px; height: 48px; border-radius: 14px; overflow: hidden; flex: none; background: #F8D9A8; border: 2px solid #fff; box-shadow: 0 3px 10px rgba(60, 35, 10, .25); }
.chat-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; transform: scale(3); transform-origin: 44% 17%; display: block; }
#chat[data-busy="1"] .chat-avatar { animation: pulse-ring 1.6s ease-in-out infinite; }
@keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(228, 128, 47, .5); } 50% { box-shadow: 0 0 0 7px rgba(228, 128, 47, 0); } }
.chat-who { flex: 1; min-width: 0; }
#chat-title { margin: 0; font: 600 18px/1.1 var(--display); color: var(--bark); }
#chat-status { margin: 3px 0 0; font: 700 11px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent2); }
.chat-btn { font: 700 11px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(63, 42, 24, .15); background: #fff; color: var(--bark); cursor: pointer; }
#chat-list { list-style: none; margin: 0; padding: 4px 2px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.msg { display: flex; flex-direction: column; max-width: 92%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; }
.bubble { padding: 10px 13px; border-radius: 16px; font: 600 14.5px/1.45 var(--body); word-wrap: break-word; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--bark); color: var(--cream); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.msg.assistant .bubble { background: #fff; color: var(--ink); border-bottom-left-radius: 5px; box-shadow: 0 2px 8px rgba(40, 24, 8, .1); }
.bubble a { color: #1F7F7B; }
.bubble code { font: 13px var(--mono); background: rgba(63, 42, 24, .08); padding: 1px 5px; border-radius: 5px; }
.bubble ul { margin: 4px 0; padding-left: 18px; }
.bubble.typing::after { content: "Kitsune · " attr(data-wait); color: var(--muted); font-style: italic; }
.activity { margin-top: 6px; font: 600 12.5px/1.4 var(--body); color: var(--muted); }
.activity summary { cursor: pointer; list-style: none; padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, .6); display: inline-block; }
.activity summary::before { content: "▸ "; }
.activity[open] summary::before { content: "▾ "; }
.activity ul { margin: 6px 0 0; padding-left: 4px; list-style: none; }
.activity li::before { content: "• "; color: var(--accent); }
.activity li.run::before { content: "◌ "; }
.activity li.ok::before { content: "✓ "; color: var(--moss); }
.activity li.fail::before { content: "⚠ "; color: #C0473A; }
#chat-shortcuts { display: flex; gap: 6px; flex-wrap: wrap; flex: none; }
.chip { font: 700 11.5px/1 var(--body); padding: 8px 11px; border-radius: 999px; border: 1px solid rgba(43, 167, 163, .35); background: rgba(43, 167, 163, .1); color: #1F6F6C; cursor: pointer; }
.chip:hover { background: rgba(43, 167, 163, .2); }
.chat-input { display: flex; gap: 8px; align-items: flex-end; flex: none; }
#chat-input { flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 11px 13px; border-radius: 16px; border: 1px solid rgba(63, 42, 24, .2); background: #fff; color: var(--ink); font: 600 14.5px/1.4 var(--body); }
#chat-input:focus { outline: 3px solid rgba(43, 167, 163, .45); outline-offset: 0; }
#chat-send { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(228, 128, 47, .4); }
#chat-send:disabled { opacity: .5; cursor: default; }
/* images jointes (2026-11-03) */
#chat-attach { flex: none; width: 40px; height: 46px; border-radius: 14px; border: 1px solid rgba(63, 42, 24, .2); background: #fff; font-size: 18px; cursor: pointer; }
#chat-attach:hover { background: var(--cream); }
#chat-thumbs { display: flex; gap: 8px; flex-wrap: wrap; flex: none; }
#chat-thumbs[hidden] { display: none; }
.thumb { position: relative; width: 58px; height: 58px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(63, 42, 24, .2); background: #fff; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(44, 29, 16, .78); color: #fff; font: 700 12px/20px var(--body); padding: 0; cursor: pointer; }
.thumb.loading { display: grid; place-items: center; font: 700 11px var(--body); color: var(--muted); }
#chat.drop { box-shadow: inset 0 0 0 3px var(--accent2); }
#chat.drop::after { content: "Dépose ton image ici"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 244, 222, .82); font: 600 18px var(--display); color: var(--bark); pointer-events: none; z-index: 5; }
.bubble .pics { display: flex; gap: 6px; flex-wrap: wrap; }
.bubble .pics + .txt:not(:empty) { margin-top: 8px; }
.bubble .pics img { display: block; max-width: 120px; max-height: 120px; border-radius: 10px; cursor: zoom-in; }
#chat[data-offline="1"] #chat-status::after { content: " · démo"; color: var(--muted); }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<header class="bar">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#fff"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg></div>
  <div class="titles"><h1 id="title">Sanctuaire</h1><p class="sub" id="subtitle">Panorama</p></div>
  <div class="pills">
    <span class="pill" id="src-pill" data-src="demo"><span class="dot"></span><span id="src-txt">Démo · événements simulés</span></span>
    <button class="pill" id="demo" type="button" aria-pressed="false">Démo auto</button>
    <a class="pill" id="scenes-link" href="index.html">Les 5 scènes</a>
  </div>
</header>

<main class="viewport" id="viewport">
  <div class="pano" id="pano" data-walking="0"></div>
</main>

<p id="headline" aria-live="polite"><span id="hl-txt">Chargement…</span><small id="hl-sub">Démo · événements simulés</small></p>
<aside class="log" aria-label="Journal"><h2>Sous le capot <span id="log-src">flux simulé</span></h2><ol id="log"></ol></aside>

<aside id="chat" aria-label="Discussion avec Kitsune">
  <div class="chat-head">
    <div class="chat-avatar" aria-hidden="true"><img src="renard-rest.webp" alt=""></div>
    <div class="chat-who"><h2 id="chat-title">Parler à Kitsune</h2><p id="chat-status" aria-live="polite">Prêt</p></div>
    <button class="chat-btn" id="chat-folder-menu" type="button" title="Renommer ou archiver ce dossier" hidden>⋯</button>
    <button class="chat-btn" id="chat-new" type="button" title="Commencer une nouvelle conversation">Nouvelle</button>
    <button class="chat-btn" id="chat-toggle" type="button" aria-expanded="false" aria-controls="chat">Ouvrir</button>
  </div>
  <nav id="chat-folders" aria-label="Dossiers">
    <div class="f-title">Dossiers</div>
    <ul id="folder-list"></ul>
    <button id="folder-add" type="button" title="Créer un dossier (une conversation à part, gardée par Hermes)">+ Dossier</button>
  </nav>
  <ol id="chat-list" aria-live="polite"></ol>
  <div id="chat-shortcuts"></div>
  <div id="chat-thumbs" hidden></div>
  <div class="chat-input">
    <button id="chat-attach" type="button" aria-label="Joindre une image" title="Joindre une image (tu peux aussi la coller ou la glisser ici)">📎</button>
    <input id="chat-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    <textarea id="chat-input" rows="1" aria-label="Ton message pour Kitsune"></textarea>
    <button id="chat-send" type="button" aria-label="Envoyer">➤</button>
  </div>
</aside>

<script src="moteur.js"></script>
<script src="chat.js"></script>
</body>
</html>
